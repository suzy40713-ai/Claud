name: AdHunter CI

on:
  push:
    paths: ["adhunter/**", ".github/workflows/adhunter-ci.yml"]
  pull_request:
    paths: ["adhunter/**", ".github/workflows/adhunter-ci.yml"]

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adhunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adhunter/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migration + RLS security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply Supabase stand-in and migration
        run: |
          psql -v ON_ERROR_STOP=1 -q -f adhunter/supabase/tests/supabase-stub.sql
          psql -v ON_ERROR_STOP=1 -q -f adhunter/supabase/migrations/0001_init.sql
      - name: Run RLS tests
        run: psql -v ON_ERROR_STOP=1 -q -f adhunter/supabase/tests/rls.test.sql | tee rls.log && grep -q "ALL RLS TESTS PASSED" rls.log
