name: BookSync CI

on:
  push:
    paths: ["booksync/**", ".github/workflows/booksync-ci.yml"]
  pull_request:
    paths: ["booksync/**", ".github/workflows/booksync-ci.yml"]

concurrency:
  group: booksync-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: booksync

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booksync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/booksync_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/booksync_test
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # Secret factice réservé à la CI (aucune donnée réelle).
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: booksync/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: booksync/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build:e2e
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: booksync/playwright-report
          retention-days: 7
