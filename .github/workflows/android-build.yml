name: Build Android app

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/ai-sports-coaching-app-qome53
    paths:
      - "sports-coach/packages/frontend/**"
      - "sports-coach/packages/shared/**"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-coach

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @sports-coach/shared

      - name: Build frontend (web assets)
        env:
          # A ajuster dans Settings > Secrets and variables > Actions > Variables
          # si l'URL du backend change.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://tiktok-ai-studio-production-80d5.up.railway.app' }}
        run: npm run build -w @sports-coach/frontend

      - name: Sync web assets into the Android project
        working-directory: sports-coach/packages/frontend
        run: npx cap sync android

      - name: Decode signing keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: sports-coach/packages/frontend/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build debug APK
        working-directory: sports-coach/packages/frontend/android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: sports-coach/packages/frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: sports-coach/packages/frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: sports-coach/packages/frontend/android/app/build/outputs/bundle/release/app-release.aab
