# Base Postgres locale gratuite pour le developpement (aucun compte cloud requis).
# Lancer avec : docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faitstory
    ports:
      - "5432:5432"
    volumes:
      - faitstory_postgres_data:/var/lib/postgresql/data

volumes:
  faitstory_postgres_data:
