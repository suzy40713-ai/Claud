services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportscoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportscoach}
      POSTGRES_DB: ${POSTGRES_DB:-sportscoach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportscoach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sportscoach:sportscoach@postgres:5432/sportscoach}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ADDITIONAL_CORS_ORIGINS: ${ADDITIONAL_CORS_ORIGINS:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      NODE_ENV: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COACH_MODEL: ${COACH_MODEL:-claude-sonnet-5}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@example.com}
      OVERLOAD_CHECK_INTERVAL_MS: ${OVERLOAD_CHECK_INTERVAL_MS:-21600000}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:5173/strava/callback}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
      EBOOK_PRICE_CENTS: ${EBOOK_PRICE_CENTS:-2999}
      EBOOK_COMPARE_AT_PRICE_CENTS: ${EBOOK_COMPARE_AT_PRICE_CENTS:-4999}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EBOOK_SENDER_EMAIL: ${EBOOK_SENDER_EMAIL:-Kadence IA <onboarding@resend.dev>}
    ports:
      - "4000:4000"
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/backend/prisma:/app/packages/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/index.html:/app/packages/frontend/index.html
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  postgres_data:
