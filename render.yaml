services:
  - type: web
    name: tiktok-ai-studio
    runtime: docker
    rootDir: tiktok-ai-studio
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
  - type: web
    name: studio-cartoon
    runtime: docker
    rootDir: studio-cartoon
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRICE_CENTS
        value: "2900"
      - key: CURRENCY
        value: eur
      - key: ACCESS_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: LEAD_NOTIFY_EMAIL
        sync: false
  # ── BookSync ───────────────────────────────────────────────
  # Région UE (RGPD). Le plan « free » se met en veille après inactivité :
  # passer en « starter » avant l'ouverture aux clients.
  - type: web
    name: booksync
    runtime: docker
    rootDir: booksync
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - booksync/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTH_RATE_LIMIT
        value: "on"
      # Emails transactionnels (Resend). Sans clé : journalisés, non envoyés.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Planificateur (Supabase pg_cron → /api/cron/notifications)
      - key: CRON_SECRET
        generateValue: true
      # Assistant BookSync (Claude Haiku, payant à l'usage) : à ajouter uniquement après accord.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASSISTANT_MONTHLY_BUDGET_USD
        value: "5"
      # Stripe Billing (clés de test pendant le développement)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # Connexion avec Google (facultatif)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Mentions légales (informations de l'éditeur)
      - key: NEXT_PUBLIC_LEGAL_COMPANY
        sync: false
      - key: NEXT_PUBLIC_LEGAL_FORM
        sync: false
      - key: NEXT_PUBLIC_LEGAL_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_LEGAL_SIREN
        sync: false
      - key: NEXT_PUBLIC_LEGAL_VAT
        sync: false
      - key: NEXT_PUBLIC_LEGAL_DIRECTOR
        sync: false
      - key: NEXT_PUBLIC_LEGAL_EMAIL
        sync: false
