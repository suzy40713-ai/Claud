databases:
  - name: faitstory-db
    plan: free
    databaseName: faitstory
    user: faitstory

services:
  - type: web
    name: faitstory-ai
    runtime: docker
    rootDir: faitstory-ai
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: faitstory-db
          property: connectionString
      - key: TTS_PROVIDER
        value: espeak
      - key: IMAGE_PROVIDER
        value: pollinations
