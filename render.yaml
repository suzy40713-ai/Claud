services:
  - type: web
    name: tiktok-ai-studio
    runtime: docker
    rootDir: tiktok-ai-studio
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: club-pro-fc27
    runtime: node
    rootDir: club-pro-fc27
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
