services:
  - type: web
    name: tiktok-ai-studio
    runtime: docker
    rootDir: tiktok-ai-studio
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
  - type: web
    name: studio-cartoon
    runtime: docker
    rootDir: studio-cartoon
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRICE_CENTS
        value: "2900"
      - key: CURRENCY
        value: eur
      - key: ACCESS_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: LEAD_NOTIFY_EMAIL
        sync: false
  # ── BookSync ───────────────────────────────────────────────
  # Région UE (RGPD). Le plan « free » se met en veille après inactivité :
  # passer en « starter » avant l'ouverture aux clients.
  - type: web
    name: booksync
    runtime: docker
    rootDir: booksync
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - booksync/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTH_RATE_LIMIT
        value: "on"
      # Facultatif : sans clé, les emails sont journalisés mais pas envoyés.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
