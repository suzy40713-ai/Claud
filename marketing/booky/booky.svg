<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- Booky, la mascotte BookSync : un petit calendrier bleu -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F7BF0"/><stop offset="1" stop-color="#2A52CC"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="425" rx="120" ry="12" fill="#000" opacity=".18"/>
  <!-- pieds -->
  <rect x="120" y="372" width="56" height="40" rx="20" fill="#1E3FA8"/>
  <rect x="224" y="372" width="56" height="40" rx="20" fill="#1E3FA8"/>
  <!-- bras -->
  <g id="arm-l"><path d="M70 230 C 30 230, 22 280, 40 300" stroke="#2A52CC" stroke-width="26" stroke-linecap="round" fill="none"/><circle cx="40" cy="302" r="20" fill="#fff"/></g>
  <g id="arm-r"><path d="M330 230 C 370 220, 382 180, 370 150" stroke="#2A52CC" stroke-width="26" stroke-linecap="round" fill="none"/><circle cx="370" cy="146" r="20" fill="#fff"/></g>
  <!-- corps -->
  <rect x="60" y="80" width="280" height="300" rx="64" fill="url(#body)"/>
  <!-- bandeau du calendrier -->
  <path d="M60 144 a64 64 0 0 1 64 -64 h152 a64 64 0 0 1 64 64 v20 h-280z" fill="#1E3FA8"/>
  <!-- anneaux -->
  <rect x="118" y="52" width="26" height="62" rx="13" fill="#fff"/>
  <rect x="256" y="52" width="26" height="62" rx="13" fill="#fff"/>
  <!-- visage -->
  <rect x="90" y="182" width="220" height="170" rx="44" fill="#fff"/>
  <g id="eyes">
    <ellipse cx="160" cy="246" rx="20" ry="24" fill="#101828"/>
    <ellipse cx="240" cy="246" rx="20" ry="24" fill="#101828"/>
    <circle cx="167" cy="237" r="7" fill="#fff"/><circle cx="247" cy="237" r="7" fill="#fff"/>
  </g>
  <ellipse cx="124" cy="290" rx="16" ry="10" fill="#FF8FA3" opacity=".7"/>
  <ellipse cx="276" cy="290" rx="16" ry="10" fill="#FF8FA3" opacity=".7"/>
  <path id="mouth" d="M172 292 Q200 322 228 292" stroke="#101828" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- coche sur le bandeau -->
  <path d="M182 124 l14 14 l28 -28" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
