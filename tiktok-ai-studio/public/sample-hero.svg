<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d">
  <title id="t">Exemple genere : renard astronaute au-dessus de Tokyo la nuit</title>
  <desc id="d">Illustration stylisee montrant le resultat d'un prompt : un renard en combinaison spatiale flottant au-dessus des toits de Tokyo, ambiance nocturne, halo rose.</desc>
  <rect width="1080" height="1920" fill="#171318"/>

  <!-- stars -->
  <g fill="#f3ede6" opacity="0.55">
    <circle cx="120" cy="180" r="3"/>
    <circle cx="860" cy="120" r="2.5"/>
    <circle cx="960" cy="340" r="3.5"/>
    <circle cx="90" cy="420" r="2"/>
    <circle cx="700" cy="90" r="2"/>
    <circle cx="300" cy="220" r="2.5"/>
    <circle cx="500" cy="150" r="2"/>
    <circle cx="150" cy="600" r="2"/>
    <circle cx="980" cy="560" r="2.5"/>
  </g>

  <!-- moon -->
  <circle cx="760" cy="420" r="150" fill="#FF2954"/>

  <!-- skyline silhouette -->
  <g fill="#0d0a0d">
    <rect x="0" y="1180" width="120" height="500"/>
    <rect x="130" y="1080" width="90" height="600"/>
    <rect x="235" y="1250" width="140" height="430"/>
    <rect x="390" y="1000" width="100" height="680"/>
    <rect x="500" y="1150" width="150" height="530"/>
    <rect x="665" y="1220" width="110" height="460"/>
    <rect x="790" y="1050" width="90" height="630"/>
    <rect x="895" y="1160" width="130" height="520"/>
    <rect x="1030" y="1230" width="50" height="450"/>
  </g>
  <g fill="#FF2954" opacity="0.85">
    <rect x="150" y="1120" width="10" height="14"/>
    <rect x="150" y="1160" width="10" height="14"/>
    <rect x="405" y="1050" width="10" height="14"/>
    <rect x="405" y="1100" width="10" height="14"/>
    <rect x="405" y="1150" width="10" height="14"/>
    <rect x="915" y="1210" width="10" height="14"/>
    <rect x="915" y="1260" width="10" height="14"/>
    <rect x="255" y="1300" width="10" height="14"/>
    <rect x="255" y="1350" width="10" height="14"/>
    <rect x="700" y="1270" width="10" height="14"/>
  </g>

  <!-- fox astronaut silhouette, centered, floating -->
  <g transform="translate(540,760)">
    <ellipse cx="0" cy="330" rx="180" ry="26" fill="#000" opacity="0.35"/>
    <!-- suit body -->
    <path d="M-95,-40 C-95,-140 -55,-200 0,-200 C55,-200 95,-140 95,-40 L95,140 C95,210 55,260 0,260 C-55,260 -95,210 -95,140 Z" fill="#f3ede6"/>
    <!-- helmet -->
    <circle cx="0" cy="-190" r="150" fill="#f3ede6"/>
    <circle cx="0" cy="-190" r="112" fill="#1a1520"/>
    <!-- fox face inside helmet -->
    <g fill="#e7823a">
      <path d="M-60,-210 L-95,-270 L-30,-235 Z"/>
      <path d="M60,-210 L95,-270 L30,-235 Z"/>
      <ellipse cx="0" cy="-180" rx="58" ry="50"/>
    </g>
    <path d="M0,-165 L-16,-140 L16,-140 Z" fill="#141014"/>
    <circle cx="-24" cy="-198" r="7" fill="#141014"/>
    <circle cx="24" cy="-198" r="7" fill="#141014"/>
    <!-- suit accents -->
    <rect x="-40" y="-10" width="80" height="60" rx="14" fill="#FF2954"/>
    <circle cx="0" cy="20" r="10" fill="#1a1520"/>
    <!-- arms -->
    <path d="M-95,10 C-170,30 -200,90 -180,150 C-165,110 -130,90 -90,80 Z" fill="#f3ede6"/>
    <path d="M95,10 C170,30 200,90 180,150 C165,110 130,90 90,80 Z" fill="#f3ede6"/>
    <!-- tail -->
    <path d="M70,140 C170,150 210,230 170,300 C160,240 120,200 60,190 Z" fill="#e7823a"/>
    <path d="M150,240 C185,260 195,290 175,300 C165,275 150,260 135,255 Z" fill="#f3ede6"/>
  </g>

  <!-- caption bar mimicking generated video/image overlay -->
  <g transform="translate(60,1740)">
    <rect x="0" y="0" width="960" height="120" rx="18" fill="#0d0a0d" opacity="0.55"/>
    <text x="480" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#f3ede6">Un renard astronaute au-dessus de Tokyo</text>
  </g>
</svg>
