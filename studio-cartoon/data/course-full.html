<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><meta name='robots' content='noindex'><title>Studio Cartoon</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout : barre latérale des modules à gauche (repliée en haut sur téléphone), une leçon à la fois à droite. */
:root{--bg:#fbf8f1;--panel:#ffffff;--ink:#1d2027;--muted:#5d6672;--line:#e5dfd2;--navy:#13233a;--on-navy:#d4dbe5;
  --accent:#e0194a;--sun:#ffc94d;--done:#1f9d55;--tint:#f2eee4;--codebg:#efeae0;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--text:'Source Sans 3','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#161d26;--ink:#eef0f3;--muted:#a3adb9;--line:#283241;--navy:#0a1220;--on-navy:#c3ccd8;--accent:#ff4d78;--done:#3ccf7d;--tint:#1c2531;--codebg:#222c39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#161d26;--ink:#eef0f3;--muted:#a3adb9;--line:#283241;--navy:#0a1220;--on-navy:#c3ccd8;--accent:#ff4d78;--done:#3ccf7d;--tint:#1c2531;--codebg:#222c39;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6}
.top{background:var(--navy);color:#fff;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--text);font-weight:400;font-size:14px;color:var(--on-navy)}
.prog{min-width:0;flex:1 1 260px;max-width:420px}
.prog .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.prog .lbl{font-size:13px;color:var(--on-navy);margin-top:5px;font-variant-numeric:tabular-nums}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
nav details{border-bottom:1px solid var(--line);padding-block:6px}
nav summary{cursor:pointer;font-weight:700;padding:6px 4px;list-style:none;display:flex;gap:8px;align-items:baseline}
nav summary::-webkit-details-marker{display:none}
nav summary .n{font-family:var(--display);color:var(--accent);font-size:14px;min-width:22px}
nav ol{list-style:none;margin:2px 0 6px;padding:0}
nav button{all:unset;cursor:pointer;display:flex;gap:8px;width:100%;padding:5px 6px 5px 30px;border-radius:8px;font-size:15px;color:var(--muted);box-sizing:border-box}
nav button:hover{background:var(--tint);color:var(--ink)}
nav button.cur{background:var(--tint);color:var(--ink);font-weight:700}
nav button .ck{width:16px;flex:none;color:var(--done)}
nav button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{min-width:0}
.crumb{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.2vw,42px);line-height:1.1;margin:6px 0 6px;text-wrap:balance}
.intro{color:var(--muted);margin:0 0 18px}
article{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,3vw,32px);max-width:78ch}
article h3{font-family:var(--display);font-size:20px;margin:22px 0 6px}
article table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
.tw{overflow-x:auto}
article th,article td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
article th{background:var(--tint)}
td.blank{height:34px;width:60%}
.note{background:var(--tint);border-left:5px solid var(--sun);padding:11px 14px;border-radius:8px;margin:14px 0}
.script{background:var(--tint);padding:12px 15px;border-radius:10px;font-size:15.5px}
code{background:var(--codebg);padding:1px 5px;border-radius:5px;font-size:.9em}
.cols{columns:2 240px;column-gap:24px;padding-left:18px}.cols li{break-inside:avoid}
ul.check{list-style:none;padding:0}ul.check li::before{content:"\2610  "}
.ex{margin-top:22px;border:2px dashed var(--done);border-radius:12px;padding:14px 16px}
.ex b{color:var(--done)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:20px;max-width:78ch}
.btn{all:unset;cursor:pointer;padding:11px 18px;border-radius:999px;font-weight:700;border:2px solid var(--line);background:var(--panel)}
.btn.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.dl{color:#fff;text-decoration:none;font-weight:700;border:2px solid rgba(255,255,255,.35);padding:8px 14px;border-radius:999px;font-size:15px}
.dl:hover{background:rgba(255,255,255,.1)}
.btn[disabled]{opacity:.4;cursor:default}
label.done{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
label.done input{width:20px;height:20px;accent-color:var(--done)}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}nav{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--panel)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><header class="top"><div class="in">
  <div class="brand">Studio Cartoon<small>13 modules · 59 leçons · 55 exercices</small></div>
  <div class="prog" aria-live="polite"><div class="bar"><i id="pbar"></i></div><div class="lbl" id="plbl"></div></div>
<a class="dl" href="__PDF_URL__">Télécharger le cahier PDF</a></div></header>
<div class="shell">
  <nav id="nav" aria-label="Modules de la formation"></nav>
  <main>
    <div class="crumb" id="crumb"></div>
    <h1 id="ltitle"></h1>
    <p class="intro" id="lintro"></p>
    <article id="lbody"></article>
    <div class="foot">
      <button class="btn" id="prev" type="button">← Précédente</button>
      <label class="done"><input type="checkbox" id="donebox"> Leçon terminée</label>
      <button class="btn main" id="next" type="button">Suivante →</button>
    </div>
  </main>
</div>
<script>
const DATA = [{"title": "Bienvenue", "intro": "Comment suivre la formation et t'organiser pour publier ta première vidéo vite.", "lessons": [{"title": "Ce que tu vas construire", "body": "\n<p>À la fin de cette formation, tu auras :<\/p>\n<ul>\n<li><b>un personnage récurrent<\/b> avec son look, sa voix et son défaut ;<\/li>\n<li><b>un kit visuel réutilisable<\/b> : personnages, décors, bouches, cartes de fin ;<\/li>\n<li><b>une méthode d'écriture<\/b> qui te permet d'écrire un script de 40 secondes en 15 minutes ;<\/li>\n<li><b>une routine de production<\/b> pour sortir une vidéo par jour sans y passer tes soirées ;<\/li>\n<li><b>une première saison de 10 épisodes<\/b> prête à publier.<\/li>\n<\/ul>\n<p>La formation suit l'ordre réel de fabrication : idée, script, hook, visuels, voix, montage, publication, croissance.\nChaque leçon se termine par un exercice. Fais-les : c'est en produisant qu'on progresse, pas en lisant.<\/p>\n", "ex": "Écris en une phrase pourquoi tu veux faire ces vidéos (t'amuser, construire une audience, vendre plus tard…). Garde cette phrase : elle t'aidera à tenir pendant les semaines où les chiffres stagnent."}, {"title": "Le matériel nécessaire", "body": "\n<table>\n<tr><th>Outil<\/th><th>À quoi il sert<\/th><th>Prix<\/th><\/tr>\n<tr><td>Un téléphone récent ou un ordinateur<\/td><td>Tout le reste<\/td><td>—<\/td><\/tr>\n<tr><td>CapCut<\/td><td>Montage, voix de synthèse, sous-titres automatiques<\/td><td>Version gratuite suffisante pour commencer<\/td><\/tr>\n<tr><td>Canva<\/td><td>Décors, cartes de fin, couvertures, suppression d'arrière-plan<\/td><td>Gratuit, certaines fonctions payantes<\/td><\/tr>\n<tr><td>Un générateur d'images IA (au choix)<\/td><td>Créer les personnages sans savoir dessiner<\/td><td>Souvent un quota gratuit<\/td><\/tr>\n<tr><td>Un micro de casque (optionnel)<\/td><td>Enregistrer ta propre voix<\/td><td>Celui de tes écouteurs suffit<\/td><\/tr>\n<tr><td>Un tableur ou une appli de notes<\/td><td>Ton carnet d'idées et ton planning<\/td><td>Gratuit<\/td><\/tr>\n<\/table>\n<div class=\"note\">Les outils changent souvent de fonctions, de prix et de conditions. Avant de publier, vérifie que tu as le droit d'utiliser commercialement ce que tu génères (images, voix, musiques, polices).<\/div>\n", "ex": "Installe CapCut et Canva, crée un compte, et crée un dossier « Studio » sur ton téléphone ou ton ordinateur avec quatre sous-dossiers : Personnages, Décors, Voix, Vidéos."}, {"title": "Ton planning sur 30 jours", "body": "\n<table>\n<tr><th>Semaine<\/th><th>Objectif<\/th><th>Modules<\/th><\/tr>\n<tr><td>Semaine 1<\/td><td>Comprendre le format, trouver ton personnage, écrire 3 scripts<\/td><td>1 à 4<\/td><\/tr>\n<tr><td>Semaine 2<\/td><td>Créer ton kit visuel et ta voix, monter ton premier épisode<\/td><td>5 à 7<\/td><\/tr>\n<tr><td>Semaine 3<\/td><td>Produire 7 épisodes en série et commencer à publier<\/td><td>8 et 9<\/td><\/tr>\n<tr><td>Semaine 4<\/td><td>Publier chaque jour, répondre aux commentaires, analyser<\/td><td>10<\/td><\/tr>\n<\/table>\n<p>Compte environ <b>1 heure par jour<\/b>. Le premier épisode prend plus de temps (2 à 4 heures) car tu crées ton kit.\nEnsuite, un épisode prend 30 à 45 minutes.<\/p>\n", "ex": "Bloque dans ton agenda un créneau fixe d'une heure par jour pour les 30 prochains jours. Note-le maintenant."}]}, {"title": "Comprendre le format", "intro": "Pourquoi ces vidéos retiennent l'attention et comment elles sont construites.", "lessons": [{"title": "Pourquoi les sketchs animés fonctionnent", "body": "\n<p>Une vidéo courte doit faire trois choses : <b>arrêter le défilement<\/b>, <b>tenir jusqu'à la fin<\/b> et\n<b>donner envie de réagir<\/b>. Le sketch animé coche les trois :<\/p>\n<ul>\n<li><b>Il se comprend sans le son<\/b> grâce aux sous-titres et aux expressions exagérées.<\/li>\n<li><b>Il crée un conflit immédiat<\/b> : quelqu'un exige quelque chose d'absurde.<\/li>\n<li><b>Il promet une récompense<\/b> : on veut voir l'exigeant remis à sa place.<\/li>\n<li><b>Il touche au vécu<\/b> : tout le monde a croisé un client impossible, un voisin pénible, un collègue de mauvaise foi.<\/li>\n<\/ul>\n<p>L'animation a un autre avantage : pas besoin d'acteurs, de décor réel ni de te montrer. Et un personnage dessiné\npeut être bien plus exagéré qu'un humain sans paraître méchant.<\/p>\n", "ex": "Fais défiler TikTok ou Shorts pendant 15 minutes et note 5 vidéos animées qui t'ont arrêté. Pour chacune, écris ce qui t'a arrêté dans les 2 premières secondes."}, {"title": "Les trois rôles", "body": "\n<table>\n<tr><th>Rôle<\/th><th>Ce qu'il fait<\/th><th>Ce que ressent le spectateur<\/th><\/tr>\n<tr><td><b>L'exigeant<\/b><\/td><td>Demande l'absurde avec une totale assurance<\/td><td>Agacement, envie qu'il perde<\/td><\/tr>\n<tr><td><b>La victime<\/b><\/td><td>Reste calme et logique<\/td><td>Identification : « c'est moi »<\/td><\/tr>\n<tr><td><b>L'autorité<\/b><\/td><td>Arrive avec une preuve et retourne la situation<\/td><td>Satisfaction, soulagement<\/td><\/tr>\n<\/table>\n<p>La clé est le <b>contraste<\/b> : plus l'exigeant est sûr de lui, plus la chute est satisfaisante. La victime ne doit\njamais crier : si elle s'énerve, le spectateur ne sait plus qui a raison.<\/p>\n<p>L'autorité peut être un patron, un contrôleur, une hôtesse, un gardien, un chef cuisinier, un médecin… Ce qui compte,\nc'est qu'elle apporte <b>une preuve concrète<\/b> : un registre, une affiche, une mesure, un ticket, une caméra.<\/p>\n", "ex": "Reprends une des vidéos notées à la leçon précédente et identifie qui joue l'exigeant, la victime et l'autorité. Si un rôle manque, explique comment la vidéo le remplace."}, {"title": "Les trois formats répétables", "body": "\n<h3>1. Le sketch dialogué<\/h3>\n<p>Trois personnages, un lieu, une chute. C'est le format de base. Exemple : « Il interdit de rire au cinéma ».<\/p>\n<h3>2. Le « Et si tu… »<\/h3>\n<p>Une voix off raconte une situation imaginaire à la deuxième personne, avec un retournement final.\nExemple : « Et si tu entendais les pensées des gens ? ». Ce format fonctionne parce que la première phrase est une\nquestion que le spectateur se pose aussitôt.<\/p>\n<h3>3. La série à personnage<\/h3>\n<p>Le même personnage revient dans chaque épisode, dans un lieu différent. Exemple : « Gérard · Épisode 4 ».\nC'est le format qui donne le plus de raisons de s'abonner, car le spectateur veut voir la suite.<\/p>\n<div class=\"note\">Conseil : commence par la série à personnage. Les deux autres formats peuvent devenir des épisodes\nspéciaux de ta série.<\/div>\n", "ex": "Choisis ton format principal pour les 30 prochains jours. Écris-le en haut de ton carnet."}, {"title": "Le personnage récurrent : ta meilleure arme pour les abonnés", "body": "\n<p>Beaucoup de créateurs publient des histoires toutes différentes et obtiennent des vues… mais presque aucun abonné.\nLa raison est simple : le spectateur regarde, rit, puis passe à la vidéo suivante. Rien ne l'incite à revenir.<\/p>\n<p>Un personnage récurrent change tout : on s'y attache, on reconnaît sa voix, on attend sa prochaine bêtise.\nL'abonnement devient le moyen de ne pas rater la suite.<\/p>\n<h3>La fiche personnage<\/h3>\n<table>\n<tr><th>Élément<\/th><th>Exemple (Gérard)<\/th><\/tr>\n<tr><td>Prénom simple et mémorable<\/td><td>Gérard<\/td><\/tr>\n<tr><td>Un seul défaut, très clair<\/td><td>Il pense que le client est roi et que tout lui est dû<\/td><\/tr>\n<tr><td>Une phrase fétiche<\/td><td>« Le client est roi ! »<\/td><\/tr>\n<tr><td>Un look reconnaissable en miniature<\/td><td>Lunettes rondes, moustache, veste bleu marine<\/td><\/tr>\n<tr><td>Une voix unique<\/td><td>Voix d'homme posée, un peu hautaine<\/td><\/tr>\n<tr><td>Un ou deux personnages qui reviennent<\/td><td>Léa la barista, Karim le patron<\/td><\/tr>\n<\/table>\n", "ex": "Remplis la fiche personnage pour ton héros. Si tu hésites entre deux défauts, garde le plus simple à expliquer en 5 mots."}]}, {"title": "Trouver des idées", "intro": "Ne plus jamais manquer d'idées, et savoir reconnaître une bonne idée avant de l'écrire.", "lessons": [{"title": "La formule en trois questions", "body": "\n<ol>\n<li><b>Quelle est la demande absurde ?<\/b> (un café sans café, un banc réservé en 1998)<\/li>\n<li><b>Quelle est la réponse logique de la victime ?<\/b> (« un café sans café, c'est de l'eau »)<\/li>\n<li><b>Quelle preuve retourne la situation ?<\/b> (une affiche « Gérard : payez d'abord »)<\/li>\n<\/ol>\n<p>Si tu peux répondre aux trois en une ligne chacune, tu as un sketch. Si la troisième question bloque, l'idée n'est pas\nencore prête : garde-la dans ton carnet.<\/p>\n<h3>Le test des 5 mots<\/h3>\n<p>Une bonne idée se résume en 5 mots ou moins : « Il veut le wifi gratuit », « Douze serviettes, zéro famille ».\nCes 5 mots deviennent souvent ton hook.<\/p>\n", "ex": "Écris 5 idées avec la formule en trois questions. Résume chacune en 5 mots maximum."}, {"title": "Les mines d'idées", "body": "\n<ul>\n<li><b>Les lieux du quotidien<\/b> : café, bus, train, avion, supermarché, cinéma, restaurant, piscine, plage, salle d'attente, parc, salle de sport, bureau, école, ascenseur.<\/li>\n<li><b>Les phrases toutes faites<\/b> : « le client est roi », « je connais le patron », « c'est pas moi », « j'étais là avant », « je paie, donc j'ai le droit ».<\/li>\n<li><b>Les petites injustices<\/b> : la place réservée, le siège qui se penche, la file qu'on double, l'accoudoir volé.<\/li>\n<li><b>Les objets<\/b> : un ticket, un coupon périmé, une carte de fidélité, un mouchoir, une serviette, un téléphone à 1 %.<\/li>\n<li><b>Tes commentaires<\/b> : « il devrait aller chez le dentiste » = ton prochain épisode.<\/li>\n<\/ul>\n<h3>La méthode lieu × défaut<\/h3>\n<p>Fais un tableau : les lieux en lignes, le défaut de ton personnage en colonne. Chaque case est une idée.\nAvec 15 lieux, tu as 15 épisodes. Avec deux défauts, 30.<\/p>\n", "ex": "Fais ton tableau lieu × défaut avec au moins 10 lieux. Remplis chaque case avec une demande absurde."}, {"title": "Banque de 60 idées", "body": "\n<ul class=\"cols\">\n<li>Il veut le wifi gratuit à vie<\/li><li>Il « connaît le pilote »<\/li><li>Sa carte VIP est une carte de boulangerie<\/li>\n<li>Il réserve 12 transats pour une famille invisible<\/li><li>La pomme est trop ronde, il veut un rabais<\/li><li>Le chef est « son ami »<\/li>\n<li>Urgence médicale : il a faim<\/li><li>Il a réservé ce banc en 1998<\/li><li>La fin du film est triste, il veut être remboursé<\/li>\n<li>Il fête son anniversaire tous les jours<\/li><li>Le plat est trop chaud, puis trop froid<\/li><li>L'eau de la piscine est mouillée<\/li>\n<li>Il se dispute avec le GPS<\/li><li>Il veut un rabais sur le soleil<\/li><li>La mer est trop salée<\/li>\n<li>Il paie en promesses<\/li><li>Il rend un yaourt vide<\/li><li>Il demande une table avec vue dans un sous-sol<\/li>\n<li>Il refuse de descendre, c'est son arrêt préféré<\/li><li>Il commande un plat sans ingrédients<\/li><li>Il exige le silence dans une fête<\/li>\n<li>Il réserve la salle de sport pour lui seul<\/li><li>Il veut l'autographe de son propre chien<\/li><li>Il rapporte un cadeau qu'il a offert<\/li>\n<li>Il réclame une météo personnalisée<\/li><li>Il prend un taxi pour traverser la rue<\/li><li>Il refuse de payer « car c'est sa tournée »<\/li>\n<li>Il veut que l'ascenseur aille plus vite pour lui<\/li><li>Il accuse ses genoux d'être trop longs<\/li><li>Il demande le menu enfant à 40 ans<\/li>\n<li>Il veut être servi avant d'arriver<\/li><li>Il veut un rabais car il a souri<\/li><li>Il veut échanger un ticket de loto perdant<\/li>\n<li>Il exige une place « côté soleil » dans le métro<\/li><li>Il se plaint que le livre a trop de pages<\/li><li>Il réclame le wifi dans l'avion… en vol<\/li>\n<li>Il veut que le prof note plus vite<\/li><li>Il demande à la bibliothèque de lire à voix haute<\/li><li>Il fait la queue à l'envers<\/li>\n<li>Il veut un remboursement car il a dormi<\/li><li>Il veut que le chien du voisin aboie moins fort<\/li><li>Il réclame le plat du voisin<\/li>\n<li>Il veut que la caisse automatique lui parle<\/li><li>Il exige une serviette chauffée à la plage<\/li><li>Il veut que le film commence quand il arrive<\/li>\n<li>Il conteste son propre ticket de caisse<\/li><li>Il veut payer avec une carte de cinéma<\/li><li>Il réserve un arbre au parc<\/li>\n<li>Il veut la vitre ouverte et fermée en même temps<\/li><li>Il exige un taxi pour son chien<\/li><li>Il demande la clé du parc public<\/li>\n<li>Il veut une réduction car il est « presque client »<\/li><li>Il veut une chambre sans murs<\/li><li>Il exige un siège près du pilote<\/li>\n<li>Il conteste l'heure affichée<\/li><li>Il veut la monnaie en pièces de 2 €<\/li><li>Il réclame le droit de garder les bougies du gâteau<\/li>\n<li>Il exige une place assise dans un concert debout<\/li><li>Il veut que la neige tombe ailleurs<\/li><li>Il veut annuler le lundi<\/li>\n<\/ul>\n", "ex": "Choisis 10 idées de cette banque (ou de ton tableau) qui collent au défaut de ton personnage. Ce sera ta saison 1."}, {"title": "Tester une idée avant de l'écrire", "body": "\n<p>Avant de passer 30 minutes sur un script, pose ces cinq questions :<\/p>\n<ol>\n<li>Est-ce que je la résume en 5 mots ?<\/li>\n<li>Est-ce que quelqu'un dans mon entourage a déjà vécu une situation proche ?<\/li>\n<li>Est-ce que la preuve finale est visible à l'écran (un objet, une affiche, un chiffre) ?<\/li>\n<li>Est-ce que la chute fait au moins sourire si je la raconte à voix haute ?<\/li>\n<li>Est-ce que ça colle au défaut de mon personnage ?<\/li>\n<\/ol>\n<p>Quatre « oui » sur cinq : écris-la. Moins : garde-la pour plus tard.<\/p>\n<p>Astuce : raconte l'idée à quelqu'un en une phrase. S'il demande « et alors, il se passe quoi ? », c'est bon signe.<\/p>\n", "ex": "Passe tes 10 idées de saison au test. Remplace celles qui ont moins de 4 oui."}]}, {"title": "Écrire le script", "intro": "La structure, les règles et la réécriture d'un script de 40 secondes.", "lessons": [{"title": "La structure en 7 temps", "body": "\n<table>\n<tr><th>Temps<\/th><th>Moment<\/th><th>Ce qui se passe<\/th><\/tr>\n<tr><td>1. Hook<\/td><td>0 – 2 s<\/td><td>Le conflit en une phrase, en gros à l'écran<\/td><\/tr>\n<tr><td>2. Demande<\/td><td>2 – 6 s<\/td><td>L'exigeant formule l'absurde<\/td><\/tr>\n<tr><td>3. Réponse<\/td><td>6 – 12 s<\/td><td>La victime répond calmement<\/td><\/tr>\n<tr><td>4. Escalade<\/td><td>12 – 20 s<\/td><td>L'exigeant insiste, encore plus absurde<\/td><\/tr>\n<tr><td>5. Appel à s'abonner<\/td><td>vers 20 s<\/td><td>Une réplique face caméra : « Abonne-toi, la suite va le faire taire »<\/td><\/tr>\n<tr><td>6. Preuve<\/td><td>20 – 35 s<\/td><td>L'autorité arrive et retourne la situation<\/td><\/tr>\n<tr><td>7. Chute et teaser<\/td><td>35 – 42 s<\/td><td>L'exigeant perd ; annonce de l'épisode suivant<\/td><\/tr>\n<\/table>\n<p>En pratique : 12 à 14 répliques, environ 110 à 140 mots en tout.<\/p>\n", "ex": "Prends ta meilleure idée et écris une phrase pour chacun des 7 temps, sans soigner le style."}, {"title": "Les règles d'écriture", "body": "\n<ul>\n<li><b>12 mots maximum par réplique.<\/b> Les sous-titres doivent se lire d'un coup d'œil.<\/li>\n<li><b>Une seule idée par réplique.<\/b> Si tu as deux blagues, fais deux répliques.<\/li>\n<li><b>La victime ne s'énerve jamais.<\/b> Son calme rend l'exigeant encore plus ridicule.<\/li>\n<li><b>L'exigeant ne doute jamais.<\/b> Même quand il perd, il trouve une excuse absurde.<\/li>\n<li><b>La preuve doit être concrète<\/b> : un chiffre, un objet, un document.<\/li>\n<li><b>Écris pour l'oreille<\/b> : lis chaque réplique à voix haute. Si tu butes, simplifie.<\/li>\n<li><b>Écris les nombres en lettres<\/b> si tu utilises une voix de synthèse (« quarante et une fois »).<\/li>\n<\/ul>\n", "ex": "Applique les 7 règles à ton script de la leçon précédente. Compte les mots de chaque réplique."}, {"title": "La chute et la preuve", "body": "\n<p>La chute est la raison pour laquelle le spectateur reste. Les meilleures chutes suivent un de ces schémas :<\/p>\n<table>\n<tr><th>Schéma<\/th><th>Exemple<\/th><\/tr>\n<tr><td><b>La preuve chiffrée<\/b><\/td><td>« Vous êtes venu quarante et une fois cette année pour votre anniversaire. »<\/td><\/tr>\n<tr><td><b>Le retournement d'identité<\/b><\/td><td>« Le pilote, c'est moi. Et je vous ai bloqué dans le jeu. »<\/td><\/tr>\n<tr><td><b>La conséquence logique<\/b><\/td><td>« La pomme est gratuite. Mais vous êtes interdit de rayon fruits. »<\/td><\/tr>\n<tr><td><b>Le retour à l'envoyeur<\/b><\/td><td>« Le contrôle qualité, c'est huit euros. Plus le pourboire. »<\/td><\/tr>\n<tr><td><b>La rechute<\/b><\/td><td>Il devient poli… puis redemande un majordome.<\/td><\/tr>\n<\/table>\n<p>Termine toujours par une réaction courte et absurde de l'exigeant (« Mes genoux sont humiliés ! ») : c'est souvent la\nréplique la plus partagée.<\/p>\n", "ex": "Écris trois chutes différentes pour le même script, avec trois schémas différents. Garde la plus surprenante."}, {"title": "Le teaser de fin", "body": "\n<p>La dernière réplique sert à faire revenir le spectateur. Elle annonce l'épisode suivant :<\/p>\n<ul>\n<li>« Demain, Gérard prend l'avion. Suis-le pour l'épisode deux ! »<\/li>\n<li>« La semaine prochaine, il découvre la salle de sport. »<\/li>\n<li>« Épisode suivant : il a un plan pour ne plus jamais payer. »<\/li>\n<\/ul>\n<p>Ne promets jamais une suite que tu ne publieras pas. Un spectateur déçu ne revient pas.<\/p>\n", "ex": "Écris le teaser des 10 épisodes de ta saison, en enchaînant les lieux."}, {"title": "Réécrire en trois passes", "body": "\n<ol>\n<li><b>Passe « couper »<\/b> : supprime tout ce qui n'aide ni la montée ni la chute. Vise 20 % de mots en moins.<\/li>\n<li><b>Passe « contraste »<\/b> : rends l'exigeant plus sûr de lui et la victime plus calme.<\/li>\n<li><b>Passe « oreille »<\/b> : lis tout à voix haute avec un chronomètre. Au-dessus de 45 secondes, coupe encore.<\/li>\n<\/ol>\n<h3>Avant / après<\/h3>\n<p class=\"script\"><b>Avant<\/b> : « Bonjour madame, est-ce que vous pourriez éventuellement me donner un café, parce que\nc'est mon anniversaire aujourd'hui, donc normalement ça devrait être gratuit, non ? »<br>\n<b>Après<\/b> : « Bonjour. C'est mon anniversaire. Donc le café est gratuit. »<\/p>\n", "ex": "Fais les trois passes sur ton script et chronomètre-le."}, {"title": "Trois scripts commentés", "body": "\n<h3>Le café (épisode 1)<\/h3>\n<p class=\"script\"><b>Gérard<\/b> : Bonjour. C'est mon anniversaire. Donc le café est gratuit. <i>(demande)<\/i><br>\n<b>Léa<\/b> : Joyeux anniversaire monsieur. Ça fait deux euros. <i>(réponse calme)<\/i><br>\n<b>Gérard<\/b> : Les rois ne paient pas leur anniversaire. <i>(escalade)<\/i><br>\n<b>Léa<\/b> : Vous êtes déjà venu hier pour votre anniversaire.<br>\n<b>Gérard<\/b> : Hier, c'était mon demi-anniversaire. <i>(excuse absurde)<\/i><br>\n<b>Le patron<\/b> : Vous êtes venu quarante et une fois cette année pour le fêter. On a une affiche. <i>(preuve chiffrée)<\/i><\/p>\n<h3>L'avion (épisode 2)<\/h3>\n<p class=\"script\"><b>Gérard<\/b> : Madame, je veux votre place. Je connais le pilote.<br>\n<b>Voisine<\/b> : Votre ami ne sait même pas que vous existez.<br>\n<b>Gérard<\/b> : Si ! On joue ensemble en ligne depuis dix ans.<br>\n<b>Hôtesse<\/b> : Le pilote, c'est moi. Vous m'avez écrit quarante messages dans le jeu. Je vous ai bloqué. <i>(retournement d'identité)<\/i><\/p>\n<h3>Le supermarché (épisode 5)<\/h3>\n<p class=\"script\"><b>Gérard<\/b> : Cette pomme est trop ronde. Je veux un rabais.<br>\n<b>Caissier<\/b> : Vous voulez payer moins cher parce qu'elle est parfaite ?<br>\n<b>Gérard<\/b> : Exactement. La perfection, ça se négocie.<br>\n<b>Vigile<\/b> : La semaine dernière, vous vouliez un rabais parce qu'elle était cabossée. <i>(preuve par le passé)<\/i><\/p>\n", "ex": "Annote ton propre script de la même manière : écris en italique le rôle de chaque réplique."}]}, {"title": "Les hooks", "intro": "Gagner les deux premières secondes, celles qui décident de tout.", "lessons": [{"title": "Pourquoi les deux premières secondes comptent", "body": "\n<p>Sur TikTok et Shorts, le spectateur décide en un instant s'il reste. Si la première image ne crée pas de question,\nil fait défiler. L'algorithme mesure ce comportement : une vidéo quittée tout de suite est montrée à moins de monde.<\/p>\n<p>Le hook doit donc être :<\/p>\n<ul>\n<li><b>lisible sans le son<\/b> (beaucoup regardent en silencieux) ;<\/li>\n<li><b>visible dès la première image<\/b>, pas après une intro ;<\/li>\n<li><b>une question ouverte<\/b> dans la tête du spectateur.<\/li>\n<\/ul>\n", "ex": "Regarde les 5 premières secondes de tes 3 vidéos préférées sans le son. Note ce que tu comprends."}, {"title": "12 formules de hook", "body": "\n<ol>\n<li><b>La demande absurde<\/b> : « Il veut un café sans café »<\/li>\n<li><b>Le chiffre<\/b> : « 4 heures. 1 verre d'eau. »<\/li>\n<li><b>Le « Et si… »<\/b> : « Et si tu voyais un chiffre sur chaque tête ? »<\/li>\n<li><b>La répétition<\/b> : « Son anniversaire. Encore. »<\/li>\n<li><b>La contradiction<\/b> : « Il se croit vieux. Il a 26 ans. »<\/li>\n<li><b>Le secret<\/b> : « Ton chat pense à ça »<\/li>\n<li><b>La promesse de chute<\/b> : « Regarde la fin »<\/li>\n<li><b>La question directe<\/b> : « Tu aurais fait quoi ? »<\/li>\n<li><b>L'objet improbable<\/b> : « Douze serviettes, zéro famille »<\/li>\n<li><b>Le défi<\/b> : « Personne ne tient jusqu'à la fin sans rire »<\/li>\n<li><b>L'épisode<\/b> : « Gérard · Épisode 4 : la piscine »<\/li>\n<li><b>La citation<\/b> : « “Le client est roi.” Pas ici. »<\/li>\n<\/ol>\n", "ex": "Écris 3 hooks différents pour chacun de tes 3 premiers scripts, avec 3 formules différentes."}, {"title": "Le texte à l'écran", "body": "\n<ul>\n<li><b>6 mots maximum<\/b>, en gros, au centre de l'écran.<\/li>\n<li><b>Contraste fort<\/b> : noir sur jaune, ou blanc sur fond sombre avec contour.<\/li>\n<li><b>Légèrement penché<\/b> (2 à 4°) pour un effet « sticker » qui attire l'œil.<\/li>\n<li><b>Affiché pendant toute la première réplique<\/b>, puis il disparaît.<\/li>\n<li><b>Hors des zones masquées<\/b> par l'interface (évite le bas de l'écran et le bord droit).<\/li>\n<\/ul>\n", "ex": "Crée dans Canva un modèle de bandeau de hook à ton style (couleurs, police) que tu réutiliseras à chaque épisode."}, {"title": "Tester ses hooks", "body": "\n<p>Tu ne sauras jamais à l'avance quel hook marche le mieux. Teste :<\/p>\n<ul>\n<li>Publie deux épisodes de même qualité avec deux formules de hook différentes et compare la rétention des 3 premières secondes.<\/li>\n<li>Republie une vidéo qui a fait peu de vues quelques semaines plus tard avec un hook différent.<\/li>\n<li>Note chaque résultat dans ton tableau : formule, vues, pourcentage de spectateurs restés après 3 secondes.<\/li>\n<\/ul>\n<p>Au bout de 10 vidéos, tu sauras quelles formules marchent pour ton audience.<\/p>\n", "ex": "Ajoute à ton tableur une colonne « formule de hook » et une colonne « rétention à 3 s »."}]}, {"title": "Créer ton univers visuel", "intro": "Un kit de personnages et de décors créé une fois, réutilisé à chaque épisode.", "lessons": [{"title": "Choisir un style simple", "body": "\n<p>Le style le plus efficace pour ce format : <b>cartoon plat<\/b>, contours noirs épais, grosses têtes rondes, grands\nyeux, couleurs franches, très peu de détails.<\/p>\n<ul>\n<li>Il se lit bien en petit, sur un écran de téléphone.<\/li>\n<li>Il est facile à garder cohérent d'un épisode à l'autre.<\/li>\n<li>Les expressions (sourcils, bouche) se voient immédiatement.<\/li>\n<\/ul>\n<p>Évite les styles réalistes ou très détaillés : ils demandent beaucoup plus de travail et se lisent moins bien.<\/p>\n", "ex": "Rassemble 5 images de référence qui représentent le style que tu vises. Range-les dans le dossier Personnages."}, {"title": "Créer ton personnage principal", "body": "\n<p>Avec un générateur d'images, garde <b>exactement la même description<\/b> à chaque génération. Exemple de description :<\/p>\n<p class=\"script\">cartoon flat style, thick black outline, simple shapes, big round head, big round eyes, a middle-aged man\nwith round glasses and a brown moustache, navy blue blazer over a white shirt, dark trousers, standing, full body,\nfront view, plain white background<\/p>\n<ul>\n<li>Génère plusieurs versions et garde celle qui se reconnaît le mieux en miniature.<\/li>\n<li>Génère ensuite le <b>même personnage<\/b> avec plusieurs expressions : neutre, content, énervé, choqué, triste.<\/li>\n<li>Note la description finale dans ta fiche personnage : c'est ta « recette ».<\/li>\n<\/ul>\n<div class=\"note\">Les générateurs ne gardent pas toujours un personnage identique d'une image à l'autre. Si c'est le cas,\ngarde une seule image de base et crée les expressions en modifiant uniquement les yeux et la bouche (voir la leçon sur les bouches).<\/div>\n", "ex": "Génère ton personnage principal et ses 5 expressions. Garde-les avec un fond blanc uni."}, {"title": "Les seconds rôles", "body": "\n<p>Il te faut 3 à 5 seconds rôles aux silhouettes bien différentes : une barista, un patron, une hôtesse, un contrôleur,\nun serveur. Variations à jouer : couleur de peau, coiffure, couleur de vêtement, accessoire (casquette, lunettes, plateau).<\/p>\n<p>Astuce : un même second rôle peut changer de métier en changeant juste son haut et son accessoire. Tu gagnes du temps\net tu gardes un style cohérent.<\/p>\n", "ex": "Crée 3 seconds rôles avec la même recette de style que ton héros."}, {"title": "Les décors", "body": "\n<p>Un décor de sketch n'a besoin que de 3 couches :<\/p>\n<ol>\n<li><b>Le mur<\/b> (une couleur, quelques éléments : un tableau, une fenêtre, une étagère) ;<\/li>\n<li><b>Le sol<\/b> (parquet, carrelage, moquette) avec une ligne d'horizon nette ;<\/li>\n<li><b>Un élément de premier plan<\/b> qui situe le lieu : un comptoir, un siège de bus, une table, une caisse.<\/li>\n<\/ol>\n<p>Crée tes décors au format 1080 × 1920 dans Canva avec des formes simples, ou génère-les avec la même recette de style\n(« empty room, no people »). Garde le premier plan sur un calque séparé pour pouvoir placer les personnages derrière.<\/p>\n<table><tr><th>Lieu<\/th><th>Mur<\/th><th>Premier plan<\/th><\/tr>\n<tr><td>Café<\/td><td>Vert foncé, menu ardoise, lampes<\/td><td>Comptoir, machine à café<\/td><\/tr>\n<tr><td>Bus<\/td><td>Fenêtres, barres jaunes<\/td><td>Siège bleu<\/td><\/tr>\n<tr><td>Cinéma<\/td><td>Rideaux rouges, affiches<\/td><td>Fauteuils rouges<\/td><\/tr>\n<tr><td>Supermarché<\/td><td>Rayons colorés<\/td><td>Caisse, tapis<\/td><\/tr>\n<tr><td>Avion<\/td><td>Hublots<\/td><td>Siège, tablette<\/td><\/tr><\/table>\n", "ex": "Crée 3 décors : le lieu de ton épisode 1 et deux lieux que tu réutiliseras souvent."}, {"title": "Découper et organiser ton kit", "body": "\n<ul>\n<li>Supprime l'arrière-plan de chaque personnage (outil de suppression d'arrière-plan de Canva ou CapCut) et exporte en PNG transparent.<\/li>\n<li>Nomme les fichiers clairement : <code>gerard_enerve.png<\/code>, <code>lea_neutre.png<\/code>, <code>decor_cafe.png<\/code>.<\/li>\n<li>Range tout dans ton dossier Studio. Un kit bien rangé te fait gagner 10 minutes par épisode.<\/li>\n<\/ul>\n", "ex": "Découpe et renomme tout ton kit actuel."}, {"title": "Les bouches pour faire parler", "body": "\n<p>Pour qu'un personnage ait l'air de parler, il suffit d'alterner <b>deux ou trois formes de bouche<\/b> :<\/p>\n<ol><li>fermée (un trait) ;<\/li><li>mi-ouverte (un petit ovale) ;<\/li><li>ouverte (un grand ovale sombre).<\/li><\/ol>\n<p>Dessine-les dans Canva (formes simples), à la couleur de ton style, et exporte-les en PNG transparent.\nAu montage, tu poses la bouche par-dessus le visage et tu alternes ouverte / fermée pendant que le personnage parle.<\/p>\n<p>Option plus simple : utilise une image « bouche ouverte » et une image « bouche fermée » du personnage entier et alterne-les.<\/p>\n", "ex": "Crée tes 3 formes de bouche et vérifie qu'elles collent bien au visage de ton héros."}]}, {"title": "La voix et le son", "intro": "Donner une voix à chaque personnage et un son qui rythme la vidéo.", "lessons": [{"title": "La voix de synthèse dans CapCut", "body": "\n<ol>\n<li>Ajoute un texte avec la réplique.<\/li>\n<li>Sélectionne-le, puis choisis l'option de texte en parole (le nom peut varier selon la version).<\/li>\n<li>Choisis une voix française et applique.<\/li>\n<li>Supprime ou masque le texte si tu ajoutes les sous-titres automatiques plus tard.<\/li>\n<\/ol>\n<ul>\n<li>Fais <b>une réplique à la fois<\/b> : c'est plus naturel et plus facile à caler.<\/li>\n<li>Ajoute des <b>virgules<\/b> pour créer des pauses.<\/li>\n<li>Écris les <b>nombres en lettres<\/b>, évite les sigles.<\/li>\n<li>Accélère légèrement (1,05× à 1,15×) si la voix traîne.<\/li>\n<\/ul>\n", "ex": "Génère toutes les répliques de ton script d'épisode 1 en voix de synthèse."}, {"title": "Une voix par personnage", "body": "\n<p>Les spectateurs reconnaissent un personnage à sa voix. Choisis <b>une voix par personnage<\/b> et note-la dans sa fiche.\nNe change jamais la voix de ton héros, même si une nouvelle voix semble meilleure.<\/p>\n<table><tr><th>Personnage<\/th><th>Type de voix<\/th><\/tr>\n<tr><td>Héros exigeant<\/td><td>Voix posée, un peu hautaine<\/td><\/tr>\n<tr><td>Victime<\/td><td>Voix douce, calme<\/td><\/tr>\n<tr><td>Autorité<\/td><td>Voix ferme, plus grave ou plus sèche<\/td><\/tr><\/table>\n", "ex": "Choisis et note la voix de chacun de tes personnages."}, {"title": "Enregistrer ta propre voix", "body": "\n<ul>\n<li>Enregistre dans une petite pièce pleine de tissus (placard, chambre), loin des murs nus : moins d'écho.<\/li>\n<li>Tiens le micro à une main de ta bouche, légèrement de côté.<\/li>\n<li>Fais 2 ou 3 prises de chaque réplique et garde la meilleure.<\/li>\n<li>Change ta voix pour chaque personnage : plus grave, plus aiguë, plus lente, avec un tic.<\/li>\n<li>Dans CapCut, utilise la réduction de bruit si l'option est disponible.<\/li>\n<\/ul>\n<p>Ta propre voix rend les vidéos plus authentiques. Tu peux aussi mélanger : ta voix pour le héros, la synthèse pour les autres.<\/p>\n", "ex": "Enregistre ta voix sur 3 répliques et compare avec la version synthèse. Garde ce qui sonne le plus naturel."}, {"title": "Ambiance et effets sonores", "body": "\n<ul>\n<li><b>Ambiance<\/b> : un fond très léger qui situe le lieu (murmure de café, moteur de bus, salle de cinéma).<\/li>\n<li><b>Pas<\/b> quand un personnage entre ou sort.<\/li>\n<li><b>« Ding »<\/b> au moment de l'appel à s'abonner.<\/li>\n<li><b>Petit « boum »<\/b> sur le hook à la première image.<\/li>\n<li><b>Silence<\/b> juste avant la chute : il crée la tension.<\/li>\n<\/ul>\n<div class=\"note\">Utilise uniquement des sons et musiques libres de droits ou fournis par la plateforme. Une musique protégée peut faire bloquer ta vidéo.<\/div>\n", "ex": "Rassemble 5 sons de base dans ton dossier Voix : ambiance café, pas, ding, boum, ambiance extérieure."}, {"title": "Régler les volumes", "body": "\n<table><tr><th>Piste<\/th><th>Volume conseillé<\/th><\/tr>\n<tr><td>Voix<\/td><td>100 %<\/td><\/tr>\n<tr><td>Effets (pas, ding)<\/td><td>40 à 60 %<\/td><\/tr>\n<tr><td>Ambiance<\/td><td>10 à 20 %<\/td><\/tr>\n<tr><td>Musique (si tu en mets)<\/td><td>5 à 15 %<\/td><\/tr><\/table>\n<p>Écoute toujours le résultat au casque <b>et<\/b> sur le haut-parleur du téléphone : c'est ainsi que la plupart des gens l'entendront.<\/p>\n", "ex": "Monte un essai de 10 secondes avec voix, ambiance et un effet, et vérifie l'équilibre sur ton téléphone."}]}, {"title": "Animer et monter dans CapCut", "intro": "De ton kit à la vidéo finie, étape par étape.", "lessons": [{"title": "Préparer le projet", "body": "\n<ul>\n<li>Nouveau projet au format <b>9:16<\/b>.<\/li>\n<li>Pose le décor sur toute la durée.<\/li>\n<li>Importe toutes les voix et place-les dans l'ordre, avec une petite pause (0,2 à 0,3 s) entre les répliques.<\/li>\n<li>La durée totale de la vidéo est maintenant fixée par les voix : vise 35 à 45 secondes.<\/li>\n<\/ul>\n", "ex": "Crée le projet de ton épisode 1 avec le décor et toutes les voix en place."}, {"title": "Placer et animer les personnages", "body": "\n<ul>\n<li>Ajoute chaque personnage en superposition (incrustation).<\/li>\n<li>Place-les sur la ligne du sol, à la même échelle.<\/li>\n<li>Ajoute de petites animations avec les images clés : léger rebond quand un personnage parle, glissement pour une entrée.<\/li>\n<li>Change l'image du personnage selon l'émotion de la réplique (neutre, énervé, choqué).<\/li>\n<li>Fais entrer l'autorité depuis le bord de l'écran en 1 à 1,5 seconde.<\/li>\n<\/ul>\n<p>Garde les mouvements simples : un personnage qui bouge un peu paraît vivant ; un personnage qui bouge trop fatigue l'œil.<\/p>\n", "ex": "Anime l'entrée de l'autorité et trois changements d'expression dans ton épisode 1."}, {"title": "Faire parler les personnages", "body": "\n<p>Sur chaque réplique, alterne bouche ouverte et bouche fermée en suivant la voix : environ 3 à 5 changements par\nseconde. Inutile d'être parfait : l'œil accepte très bien une synchronisation approximative.<\/p>\n<p>Astuce de gain de temps : crée une séquence « bouche qui parle » de 2 secondes (ouverte, fermée, mi-ouverte en boucle),\npuis copie-colle-la sur la durée de chaque réplique.<\/p>\n", "ex": "Fais parler tes personnages sur toutes les répliques de l'épisode 1."}, {"title": "Les plans et les zooms", "body": "\n<ul>\n<li><b>Plan large<\/b> au début : on voit qui est là.<\/li>\n<li><b>Léger zoom<\/b> (5 à 10 %) sur celui qui parle, pour guider le regard.<\/li>\n<li><b>Gros plan<\/b> sur l'exigeant pour sa réaction finale.<\/li>\n<li>Un zoom par réplique maximum : trop de mouvements donnent mal au cœur.<\/li>\n<\/ul>\n", "ex": "Ajoute un léger zoom sur le personnage qui parle à chaque réplique importante."}, {"title": "Les sous-titres", "body": "\n<ul>\n<li>Utilise les <b>sous-titres automatiques<\/b>, puis corrige les fautes à la main.<\/li>\n<li>Police épaisse, grande taille, contour noir.<\/li>\n<li>Un mot en couleur pour l'accent, ou une couleur par personnage.<\/li>\n<li>Place-les au-dessus du tiers inférieur, hors des boutons de l'application.<\/li>\n<li>Deux lignes maximum à l'écran à la fois.<\/li>\n<\/ul>\n", "ex": "Ajoute et corrige les sous-titres de ton épisode 1."}, {"title": "Le hook, l'appel au milieu et la carte de fin", "body": "\n<ul>\n<li><b>Le hook<\/b> : ton bandeau Canva en gros, de la première image jusqu'à la fin de la première réplique.<\/li>\n<li><b>L'appel au milieu<\/b> : vers 45 % de la vidéo, un bandeau « Abonne-toi » avec un bouton et une main qui clique, accompagné d'un « ding ».<\/li>\n<li><b>La carte de fin<\/b> : « Suis [ton personnage] ! » + « Épisode suivant demain », sur les 2 à 3 dernières secondes.<\/li>\n<\/ul>\n<p>Prépare ces trois éléments une seule fois dans Canva, avec ton style, et réutilise-les à chaque épisode.<\/p>\n", "ex": "Crée ta carte de fin et ton bandeau d'appel au milieu dans Canva, puis ajoute-les à l'épisode 1."}, {"title": "Exporter", "body": "\n<ul>\n<li>Résolution <b>1080p<\/b>, 30 images par seconde (ou 60 si ton téléphone le permet).<\/li>\n<li>Regarde toute la vidéo une dernière fois, en entier, sur ton téléphone.<\/li>\n<li>Vérifie : le hook se lit, les sous-titres sont justes, le son est équilibré, la fin n'est pas coupée.<\/li>\n<li>Range l'export dans ton dossier Vidéos avec un nom clair : <code>ep01_anniversaire.mp4<\/code>.<\/li>\n<\/ul>\n", "ex": "Exporte ton épisode 1. Félicitations : tu as fini ta première vidéo."}]}, {"title": "Produire en série", "intro": "Passer d'une vidéo laborieuse à une vidéo par jour.", "lessons": [{"title": "Le principe du lot", "body": "\n<p>Faire chaque étape pour plusieurs vidéos d'un coup est bien plus rapide que de faire chaque vidéo de A à Z :<\/p>\n<table><tr><th>Jour<\/th><th>Tâche<\/th><th>Durée<\/th><\/tr>\n<tr><td>Lundi<\/td><td>Écrire 7 scripts<\/td><td>1 h 30<\/td><\/tr>\n<tr><td>Mardi<\/td><td>Générer toutes les voix<\/td><td>45 min<\/td><\/tr>\n<tr><td>Mercredi à vendredi<\/td><td>Monter 2 à 3 épisodes par jour<\/td><td>1 h par jour<\/td><\/tr>\n<tr><td>Samedi<\/td><td>Programmer les publications de la semaine<\/td><td>30 min<\/td><\/tr><\/table>\n<p>Ton cerveau reste dans le même mode (écrire, enregistrer, monter) et tu ne perds pas de temps à changer d'outil.<\/p>\n", "ex": "Planifie ta prochaine semaine en lots selon ce tableau."}, {"title": "Ton projet modèle", "body": "\n<p>Dans CapCut, garde un projet « MODÈLE » qui contient déjà :<\/p>\n<ul><li>le format 9:16 ;<\/li><li>ton bandeau de hook (texte à changer) ;<\/li><li>l'appel au milieu ;<\/li>\n<li>la carte de fin ;<\/li><li>ton style de sous-titres ;<\/li><li>l'ambiance sonore.<\/li><\/ul>\n<p>Pour chaque nouvel épisode : duplique le modèle, change le décor, remplace les voix, place les personnages.\nTu ne refais jamais le travail de mise en forme.<\/p>\n", "ex": "Transforme ton épisode 1 en projet modèle en retirant tout ce qui est spécifique à l'épisode."}, {"title": "Écrire 7 scripts en une séance", "body": "\n<ol>\n<li>Pars de 7 idées validées (module 2).<\/li>\n<li>Écris d'abord les 7 squelettes en 7 temps (une phrase par temps).<\/li>\n<li>Puis rédige les 7 dialogues complets.<\/li>\n<li>Fais ensuite les trois passes de réécriture sur les 7 à la suite.<\/li>\n<li>Termine par les 7 hooks et les 7 teasers, qui doivent s'enchaîner.<\/li>\n<\/ol>\n<p>Tu peux t'aider d'un assistant d'IA pour proposer des variantes de répliques, mais garde toujours la main sur le défaut\ndu personnage et sur la chute : c'est ce qui donne son identité à ta série.<\/p>\n", "ex": "Écris tes 7 prochains scripts en une seule séance de 1 h 30."}, {"title": "Gagner du temps sans perdre en qualité", "body": "\n<ul>\n<li>Réutilise les mêmes décors : 5 lieux suffisent pour une saison.<\/li>\n<li>Réutilise les mêmes seconds rôles avec un accessoire différent.<\/li>\n<li>Garde une bibliothèque d'expressions déjà découpées.<\/li>\n<li>Utilise les sous-titres automatiques, puis corrige seulement les fautes.<\/li>\n<li>Ne cherche pas la perfection : publie, observe, améliore l'épisode suivant.<\/li>\n<\/ul>\n", "ex": "Chronomètre ton prochain épisode et note le temps passé par étape. Identifie l'étape la plus longue."}]}, {"title": "Publier", "intro": "Mettre chaque vidéo dans les meilleures conditions.", "lessons": [{"title": "Quand publier", "body": "\n<ul>\n<li><b>Tous les jours, à la même heure.<\/b> La régularité compte plus que l'heure exacte.<\/li>\n<li>Commence par le début de soirée (18 h – 20 h), puis ajuste avec tes statistiques (heures où ton audience est active).<\/li>\n<li>Publie au moins 3 à 4 semaines avant de juger tes résultats.<\/li>\n<\/ul>\n", "ex": "Choisis ton heure de publication et note-la dans ta bio."}, {"title": "Légende et hashtags", "body": "\n<p><b>La légende<\/b> : une phrase drôle + l'annonce de la suite.<br>\n<i>« Épisode 1 : Gérard fête son anniversaire. Pour la 41e fois. Demain : il prend l'avion. »<\/i><\/p>\n<p><b>Les hashtags<\/b> : 3 à 5, dont un propre à ta série (<code>#gerard<\/code>), un ou deux du thème\n(<code>#humour<\/code>, <code>#sketch<\/code>) et un ou deux larges (<code>#animation<\/code>).<\/p>\n<p><b>Le commentaire épinglé<\/b> : une question qui fait réagir (« Il va où demain ? »).<\/p>\n", "ex": "Prépare les légendes et commentaires épinglés de tes 7 prochains épisodes."}, {"title": "Couvertures et miniatures", "body": "\n<ul>\n<li><b>TikTok<\/b> : choisis une couverture avec ton personnage bien visible et le titre de l'épisode. Les couvertures alignées sur ton profil donnent une impression de série.<\/li>\n<li><b>YouTube<\/b> : pour une vidéo longue, crée une miniature 1280 × 720 avec le personnage en gros, une émotion forte et 3 à 5 mots.<\/li>\n<li>Garde la même mise en page pour toutes les couvertures d'une saison.<\/li>\n<\/ul>\n", "ex": "Crée un modèle de couverture dans Canva pour ta série."}, {"title": "Publier sur plusieurs plateformes", "body": "\n<p>La même vidéo verticale peut aller sur TikTok, YouTube Shorts et Instagram Reels. Quelques règles :<\/p>\n<ul>\n<li>Exporte une version <b>sans filigrane<\/b> (le fichier original de CapCut) pour les autres plateformes.<\/li>\n<li>Adapte la légende et les hashtags à chaque plateforme.<\/li>\n<li>Regroupe tes épisodes en compilation pour une vidéo YouTube longue (« Gérard, saison 1 en entier »).<\/li>\n<\/ul>\n", "ex": "Publie ton épisode 1 sur au moins deux plateformes."}]}, {"title": "Grandir", "intro": "Transformer des vues en abonnés, puis en communauté.", "lessons": [{"title": "Ton profil : la page qui décide de l'abonnement", "body": "\n<p>Quand une vidéo plaît, le spectateur va voir ton profil. En trois secondes, il doit comprendre ce qu'il gagne à s'abonner.<\/p>\n<ul>\n<li><b>Photo de profil<\/b> : ton personnage, en gros plan.<\/li>\n<li><b>Bio<\/b> : qui est ton personnage + ton rythme. Exemple : « Gérard, le client qui exige tout. 1 épisode par jour, 18 h 30. »<\/li>\n<li><b>Vidéos épinglées<\/b> : tes épisodes 1, 2 et 3 (ou tes 3 meilleurs).<\/li>\n<li><b>Grille cohérente<\/b> : couvertures dans le même style.<\/li>\n<\/ul>\n", "ex": "Refais ta photo de profil, ta bio et tes épingles selon ces règles."}, {"title": "Les commentaires", "body": "\n<ul>\n<li>Réponds à <b>tous<\/b> les commentaires dans l'heure qui suit la publication.<\/li>\n<li>Réponds en restant dans l'univers (tu peux même répondre « en tant que » ton personnage).<\/li>\n<li>Transforme les meilleures suggestions en épisodes et dis-le (« Idée de @… ! »).<\/li>\n<li>Utilise la réponse vidéo à un commentaire pour faire un épisode demandé par un abonné.<\/li>\n<\/ul>\n", "ex": "Pendant une semaine, réponds à chaque commentaire dans l'heure et note les idées proposées."}, {"title": "Saisons, épisodes spéciaux et suite", "body": "\n<ul>\n<li><b>Saisons de 10 épisodes<\/b> : un début, une montée, une finale. La finale annonce la saison suivante.<\/li>\n<li><b>Épisodes spéciaux<\/b> : Noël, rentrée, vacances, en lien avec l'actualité légère.<\/li>\n<li><b>Nouveaux personnages<\/b> : fais revenir les seconds rôles préférés des commentaires.<\/li>\n<li><b>Fils rouges<\/b> : une affiche « Gérard : payez d'abord » qui apparaît dans plusieurs lieux récompense les fidèles.<\/li>\n<\/ul>\n", "ex": "Écris le pitch de ta saison 2 en 5 lignes."}, {"title": "Lire tes statistiques", "body": "\n<table>\n<tr><th>Ce que tu vois<\/th><th>Ce que ça veut dire<\/th><th>Que faire<\/th><\/tr>\n<tr><td>Peu de vues<\/td><td>Le hook ou la couverture ne retient pas<\/td><td>Change la première phrase et le texte à l'écran<\/td><\/tr>\n<tr><td>Les gens partent à mi-vidéo<\/td><td>La montée est trop lente<\/td><td>Coupe une ou deux répliques<\/td><\/tr>\n<tr><td>Beaucoup de vues, peu d'abonnés<\/td><td>Rien ne donne envie de revenir<\/td><td>Personnage récurrent, épisodes numérotés, teaser<\/td><\/tr>\n<tr><td>Beaucoup de partages<\/td><td>Le sujet touche un vécu commun<\/td><td>Fais d'autres épisodes sur ce thème<\/td><\/tr>\n<tr><td>Beaucoup de commentaires<\/td><td>Le sujet fait débattre<\/td><td>Pose une question en fin de vidéo<\/td><\/tr>\n<\/table>\n<p>Analyse une fois par semaine, pas tous les jours : les chiffres d'une seule vidéo varient beaucoup.<\/p>\n", "ex": "Tous les dimanches, note dans ton tableur les vues, la durée moyenne regardée et les abonnés gagnés par vidéo."}, {"title": "Quand ça stagne", "body": "\n<p>Tout le monde passe par des semaines où rien ne décolle. Avant de tout changer :<\/p>\n<ol>\n<li>Vérifie que tu publies vraiment chaque jour, à heure fixe.<\/li>\n<li>Compare tes 3 meilleures et tes 3 pires vidéos : hook, lieu, durée, chute.<\/li>\n<li>Change <b>une seule chose<\/b> à la fois (le hook, la durée, l'heure) pendant une semaine.<\/li>\n<li>Garde ton personnage : il faut du temps pour qu'une audience s'y attache.<\/li>\n<\/ol>\n", "ex": "Fais la comparaison meilleures / pires vidéos et choisis une seule chose à changer la semaine prochaine."}]}, {"title": "Monétiser", "intro": "Les pistes réalistes pour gagner de l'argent avec ta chaîne, sans promesses magiques.", "lessons": [{"title": "Les programmes des plateformes", "body": "\n<p>TikTok, YouTube et Instagram ont des programmes de rémunération des créateurs. Ils ont tous des <b>conditions\nd'accès<\/b> (nombre d'abonnés, vues ou heures de visionnage minimum, âge, pays) qui changent régulièrement.\nVérifie les conditions officielles à jour sur chaque plateforme.<\/p>\n<p>Sois réaliste : les revenus par vue sont faibles pour les vidéos courtes. Ces programmes complètent tes revenus mais suffisent rarement seuls.<\/p>\n", "ex": "Note les conditions actuelles des programmes créateurs des plateformes où tu publies."}, {"title": "Les partenariats", "body": "\n<ul>\n<li>Les marques cherchent des formats originaux : un sketch où ton personnage utilise un produit peut être drôle et efficace.<\/li>\n<li>Prépare un petit dossier : ton personnage, ton audience, tes chiffres réels, deux idées de sketch pour la marque.<\/li>\n<li>Indique toujours clairement qu'un contenu est sponsorisé : c'est une obligation légale dans la plupart des pays.<\/li>\n<\/ul>\n", "ex": "Liste 5 marques dont les produits pourraient apparaître naturellement dans un épisode."}, {"title": "Vendre tes propres produits", "body": "\n<ul>\n<li><b>Produits numériques<\/b> : packs de personnages, modèles CapCut, scripts, formations.<\/li>\n<li><b>Produits physiques<\/b> : autocollants, tasses, t-shirts avec ton personnage et sa phrase fétiche.<\/li>\n<li><b>Services<\/b> : créer des sketchs animés pour d'autres (commerces, marques, créateurs).<\/li>\n<\/ul>\n<div class=\"note\">Ne promets jamais un résultat (abonnés, revenus) que tu ne peux pas garantir. C'est malhonnête, souvent\nillégal, et ta communauté s'en rendra compte.<\/div>\n", "ex": "Imagine un produit simple lié à ton personnage et décris-le en 3 lignes."}]}, {"title": "Bonus", "intro": "Checklist, modèles à remplir et 20 scripts complets.", "lessons": [{"title": "Checklist avant de publier", "body": "<ul class='check'><li>Le hook se lit en 2 secondes, sans le son<\/li><li>12 mots maximum par réplique<\/li><li>La victime reste calme<\/li><li>Une preuve concrète retourne la situation<\/li><li>L'appel à s'abonner arrive vers 45 % de la vidéo<\/li><li>La fin annonce l'épisode suivant<\/li><li>Les sous-titres sont corrigés et lisibles<\/li><li>Le son est équilibré sur le haut-parleur du téléphone<\/li><li>La durée est entre 35 et 45 secondes<\/li><li>La légende, les hashtags et le commentaire épinglé sont prêts<\/li><\/ul>", "ex": null}, {"title": "Modèles : fiche personnage et script", "body": "<h3>Fiche personnage<\/h3><table><tr><th>Prénom<\/th><td class='blank'><\/td><\/tr><tr><th>Défaut (5 mots max)<\/th><td class='blank'><\/td><\/tr><tr><th>Phrase fétiche<\/th><td class='blank'><\/td><\/tr><tr><th>Look (3 éléments reconnaissables)<\/th><td class='blank'><\/td><\/tr><tr><th>Voix (type, nom de la voix CapCut)<\/th><td class='blank'><\/td><\/tr><tr><th>Personnages qui reviennent<\/th><td class='blank'><\/td><\/tr><tr><th>Recette de style (description IA)<\/th><td class='blank'><\/td><\/tr><\/table><h3>Modèle de script<\/h3><table><tr><th>Hook (6 mots max)<\/th><td class='blank'><\/td><\/tr><tr><th>Demande absurde<\/th><td class='blank'><\/td><\/tr><tr><th>Réponse calme<\/th><td class='blank'><\/td><\/tr><tr><th>Escalade<\/th><td class='blank'><\/td><\/tr><tr><th>Appel à s'abonner<\/th><td class='blank'><\/td><\/tr><tr><th>Arrivée de l'autorité<\/th><td class='blank'><\/td><\/tr><tr><th>Preuve<\/th><td class='blank'><\/td><\/tr><tr><th>Réaction absurde<\/th><td class='blank'><\/td><\/tr><tr><th>Teaser de l'épisode suivant<\/th><td class='blank'><\/td><\/tr><\/table>", "ex": null}, {"title": "Les 10 scripts de la saison 1 de Gérard", "body": "<h3>Gérard · Épisode 1 : « Son anniversaire. Encore. »<\/h3><p class='script'><b>Gérard<\/b> : Bonjour. C&#x27;est mon anniversaire. Donc le café est gratuit.<br><b>La victime<\/b> : Joyeux anniversaire monsieur. Ça fait deux euros.<br><b>Gérard<\/b> : Les rois ne paient pas leur anniversaire.<br><b>La victime<\/b> : Vous êtes déjà venu hier pour votre anniversaire.<br><b>Gérard<\/b> : Hier, c&#x27;était mon demi-anniversaire.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : Cette employée refuse d&#x27;offrir un café à un roi !<br><b>La victime<\/b> : Abonne-toi, il va se faire démasquer.<br><b>L'autorité<\/b> : Monsieur Gérard. Votre anniversaire, c&#x27;est le trois mars.<br><b>Gérard<\/b> : Comment savez-vous ça ?<br><b>L'autorité<\/b> : Vous êtes venu quarante et une fois cette année pour le fêter. On a une affiche.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard prend l&#x27;avion. Suis-le pour l&#x27;épisode deux !<br><\/p><h3>Gérard · Épisode 2 : « Il connaît le pilote »<\/h3><p class='script'><b>Gérard<\/b> : Madame, je veux votre place. Je connais le pilote.<br><b>La victime<\/b> : Il est vingt-deux heures. Je veux dormir.<br><b>Gérard<\/b> : Le pilote est mon ami. Il va m&#x27;adorer.<br><b>La victime<\/b> : Votre ami ne sait même pas que vous existez.<br><b>Gérard<\/b> : Si ! On joue ensemble en ligne depuis dix ans.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : Je suis un ami du pilote, je demande un surclassement.<br><b>La victime<\/b> : Abonne-toi, l&#x27;hôtesse arrive avec le registre.<br><b>L'autorité<\/b> : Le pilote, c&#x27;est moi. Je suis aussi l&#x27;hôtesse. On manque de personnel.<br><b>Gérard<\/b> : Mais alors... on ne se connaît pas ?<br><b>L'autorité<\/b> : Vous m&#x27;avez écrit quarante messages dans le jeu. Je vous ai bloqué.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard monte dans le bus. Suis-le pour l&#x27;épisode trois !<br><\/p><h3>Gérard · Épisode 3 : « Il est VIP du bus »<\/h3><p class='script'><b>Gérard<\/b> : Jeune homme, levez-vous. Je suis un voyageur VIP.<br><b>La victime<\/b> : Il y a plein de places libres au fond.<br><b>Gérard<\/b> : Je veux celle-ci. Elle est plus VIP.<br><b>La victime<\/b> : Montrez-moi votre carte VIP, alors.<br><b>Gérard<\/b> : Je l&#x27;ai là. Elle ne vous regarde pas.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Contrôle des titres de transport.<br><b>Gérard<\/b> : Voici ma carte VIP, monsieur. Je voyage gratuitement.<br><b>La victime<\/b> : Abonne-toi, le contrôleur adore les cartes VIP.<br><b>L'autorité<\/b> : Monsieur, c&#x27;est une carte de fidélité de boulangerie. Dix croissants, le onzième offert.<br><b>Gérard<\/b> : C&#x27;est une carte premium !<br><b>L'autorité<\/b> : Vous avez dix tampons. Pas un seul ticket de bus. Descendez.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard part à la piscine. Suis-le pour l&#x27;épisode quatre !<br><\/p><h3>Gérard · Épisode 4 : « Douze serviettes »<\/h3><p class='script'><b>Gérard<\/b> : Pardon, ces douze transats sont à ma famille.<br><b>La victime<\/b> : Ils sont vides. Il n&#x27;y a que des serviettes.<br><b>Gérard<\/b> : Ma famille arrive. Elle est très discrète.<br><b>La victime<\/b> : Votre famille, c&#x27;est douze serviettes ?<br><b>Gérard<\/b> : Une très grande famille. Et très plate.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : Cet homme veut s&#x27;asseoir sur la chaise de ma famille.<br><b>La victime<\/b> : Abonne-toi, le maître nageur arrive.<br><b>L'autorité<\/b> : Monsieur, vous êtes arrivé à six heures du matin pour réserver douze transats. Seul.<br><b>Gérard<\/b> : Je suis quelqu&#x27;un de très prévoyant !<br><b>L'autorité<\/b> : Les serviettes partent à la consigne. Vous, vous restez au bord, debout.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard fait ses courses. Suis-le pour l&#x27;épisode cinq !<br><\/p><h3>Gérard · Épisode 5 : « Une pomme trop ronde »<\/h3><p class='script'><b>Gérard<\/b> : Cette pomme est trop ronde. Je veux un rabais.<br><b>La victime<\/b> : Monsieur, une pomme ronde, c&#x27;est normal.<br><b>Gérard<\/b> : Une pomme normale a un défaut. Celle-ci est suspecte.<br><b>La victime<\/b> : Vous voulez payer moins cher parce qu&#x27;elle est parfaite ?<br><b>Gérard<\/b> : Exactement. La perfection, ça se négocie.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : On me vend une pomme sans défaut. C&#x27;est une arnaque !<br><b>La victime<\/b> : Abonne-toi, la vigile arrive.<br><b>L'autorité<\/b> : Monsieur, la semaine dernière, vous vouliez un rabais parce qu&#x27;elle était cabossée.<br><b>Gérard<\/b> : Il faut savoir être cohérent, mais pas trop.<br><b>L'autorité<\/b> : Aujourd&#x27;hui, la pomme est gratuite. Mais vous, vous êtes interdit de rayon fruits.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard va au restaurant. Suis-le pour l&#x27;épisode six !<br><\/p><h3>Gérard · Épisode 6 : « Le chef est son ami »<\/h3><p class='script'><b>Gérard<\/b> : Le chef est mon ami. Le repas est gratuit.<br><b>La victime<\/b> : Monsieur, nous ne vous connaissons pas.<br><b>Gérard<\/b> : Appelez-le. Il sera ravi de me voir.<br><b>La victime<\/b> : Le chef a dit : si un Gérard arrive, il paie d&#x27;avance.<br><b>Gérard<\/b> : Impossible. Je suis le seul Gérard de la ville.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Bonsoir. Je suis le chef.<br><b>Gérard<\/b> : Philippe ! Mon vieil ami ! Dis-leur que je mange gratuit !<br><b>La victime<\/b> : Abonne-toi, le chef arrive.<br><b>L'autorité<\/b> : Je m&#x27;appelle Marcel. Et vous avez mangé le pain de trois tables.<br><b>Gérard<\/b> : Je teste le pain, c&#x27;est un contrôle qualité.<br><b>L'autorité<\/b> : Le contrôle qualité, c&#x27;est huit euros. Plus le pourboire.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard va chez le médecin. Suis-le pour l&#x27;épisode sept !<br><\/p><h3>Gérard · Épisode 7 : « Urgence : il a faim »<\/h3><p class='script'><b>Gérard<\/b> : Madame, laissez-moi passer. C&#x27;est une urgence.<br><b>La victime<\/b> : Moi, j&#x27;ai de la fièvre depuis trois jours.<br><b>Gérard<\/b> : Moi, j&#x27;ai faim depuis une heure. C&#x27;est pire.<br><b>La victime<\/b> : La faim, ce n&#x27;est pas une urgence médicale.<br><b>Gérard<\/b> : Si ! Mon estomac fait un bruit grave.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : J&#x27;ai une urgence ! Je veux passer devant tout le monde !<br><b>La victime<\/b> : Abonne-toi, l&#x27;infirmier va l&#x27;examiner.<br><b>L'autorité<\/b> : Quel est le symptôme ?<br><b>Gérard<\/b> : Je n&#x27;ai rien mangé depuis le petit-déjeuner de ce matin !<br><b>L'autorité<\/b> : Le seul traitement, c&#x27;est un sandwich. Et la file d&#x27;attente, dehors.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard s&#x27;invite au parc. Suis-le pour l&#x27;épisode huit !<br><\/p><h3>Gérard · Épisode 8 : « Le banc réservé en 1998 »<\/h3><p class='script'><b>Gérard<\/b> : Madame, ce banc est réservé. Depuis mille neuf cent quatre-vingt-dix-huit.<br><b>La victime<\/b> : Je mange ma glace, tranquillement.<br><b>Gérard<\/b> : Je l&#x27;ai réservé avec un mouchoir. Vous le voyez ?<br><b>La victime<\/b> : Il y a un mouchoir par terre. Il est sale.<br><b>Gérard<\/b> : C&#x27;est un mouchoir historique !<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : On me vole mon banc !<br><b>La victime<\/b> : Abonne-toi, le gardien arrive.<br><b>L'autorité<\/b> : Ce banc appartient à Madame Odette. Elle le fréquente depuis cinquante ans.<br><b>Gérard<\/b> : Mais j&#x27;ai un mouchoir !<br><b>L'autorité<\/b> : Le mouchoir est confisqué. Et ce banc vous est interdit pour la vie.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, Gérard va au cinéma. Suis-le pour l&#x27;épisode neuf !<br><\/p><h3>Gérard · Épisode 9 : « Fin triste : il veut un remboursement »<\/h3><p class='script'><b>Gérard<\/b> : Madame, ce film finit mal. Je veux un remboursement.<br><b>La victime<\/b> : Il n&#x27;est même pas fini, monsieur.<br><b>Gérard<\/b> : Je devine la fin. Elle est triste. C&#x27;est une faute.<br><b>La victime<\/b> : Vous avez dormi pendant tout le film.<br><b>Gérard<\/b> : Je dors avec les yeux ouverts. C&#x27;est une technique.<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Un souci, monsieur ?<br><b>Gérard<\/b> : Je veux être remboursé, la fin est triste !<br><b>La victime<\/b> : Abonne-toi, l&#x27;ouvreur arrive.<br><b>L'autorité<\/b> : Monsieur, c&#x27;est un dessin animé pour enfants. La fin, c&#x27;est un arc-en-ciel.<br><b>Gérard<\/b> : Un arc-en-ciel triste !<br><b>L'autorité<\/b> : Dehors. Vous pleurez dans toutes les salles depuis un an.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : Demain, grande finale de la saison. Suis-le pour ne pas la rater !<br><\/p><h3>Gérard · Épisode 10 : « Tout le monde l&#x27;attend au café »<\/h3><p class='script'><b>Gérard<\/b> : Bonjour. Cette fois, je paie. Un café, s&#x27;il vous plaît.<br><b>La victime<\/b> : Gérard ? Tu as dit s&#x27;il vous plaît ?<br><b>Gérard<\/b> : Et je paie d&#x27;avance. Même le pourboire.<br><b>La victime<\/b> : Je vais pleurer. C&#x27;est le plus beau jour.<br><b>Gérard<\/b> : Alors, c&#x27;est offert ?<br><i>(l'autorité arrive)<\/i><br><b>L'autorité<\/b> : Gérard. Ça fait plaisir de te voir si poli.<br><b>Gérard<\/b> : Merci Karim. Je me suis calmé, vous voyez ?<br><b>La victime<\/b> : Abonne-toi, la suite va te surprendre.<br><b>L'autorité<\/b> : Alors pour fêter ça, le café est offert à vie.<br><b>Gérard<\/b> : À vie ? Alors je veux aussi les croissants. Et un fauteuil. Et un majordome.<br><b>L'autorité<\/b> : Et voilà. Il n&#x27;a pas tenu trente secondes.<br><i>(Gérard s'en va)<\/i><br><b>La victime<\/b> : La saison deux arrive très vite. Suis Gérard pour ne rien rater !<br><\/p>", "ex": null}, {"title": "10 histoires « Et si tu… » complètes", "body": "<h3>Et si tu voyais un compte à rebours au-dessus des gens ?<\/h3><p class='script'>Et si un matin, tu voyais un chiffre au-dessus de la tête de chaque personne ?<br>Ta voisine : quatre-vingt-quatre. Le boulanger : soixante-sept. Un enfant : quatre-vingt-dix-neuf.<br>Tu comprends vite : ce sont des jours. Des jours avant que quelque chose leur arrive.<br>Alors tu préviens ton ami qui est à zéro : ne prends pas la voiture aujourd&#x27;hui.<br>Il rit. Mais il reste chez lui. Et le soir, un camion traverse sa rue.<br>Tu sauves des gens. Un par un. Le chiffre de chacun remonte.<br>Mais en te regardant dans le miroir du café, tu vois ton propre chiffre.<br>Et le plus étrange… c&#x27;est que ce chiffre n&#x27;a jamais bougé depuis ta naissance.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tu entendais les pensées de ton chat ?<\/h3><p class='script'>Et si tu pouvais entendre les pensées de ton chat ? Rien que les siennes.<br>Il te regarde avec ses grands yeux. Tu entends : encore lui. Il est en retard avec les croquettes.<br>Tu lui fais un câlin. Il pense : je te tolère. Trois secondes. Pas plus.<br>Tu l&#x27;appelles. Il pense : je sais très bien que tu m&#x27;appelles. Je fais semblant de dormir.<br>Tu te dis qu&#x27;il est un peu ingrat. Puis un soir tu l&#x27;entends penser autre chose.<br>Il pense : ne dors pas ce soir. Il y a quelqu&#x27;un dans la cuisine.<br>Tu te lèves en silence. Tu allumes la lumière. Et là, tu vois ton colocataire.<br>Il tient ton chat dans les bras. Et il dit : désolé, il est tellement mignon que je ne résiste pas.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tout ce que tu pensais s&#x27;affichait en sous-titres ?<\/h3><p class='script'>Et si tout ce que tu pensais s&#x27;affichait en sous-titres au-dessus de ta tête ?<br>Au travail, ton patron te parle. Et on lit : il a mauvaise haleine.<br>Tu rencontres la meilleure amie de ta copine. Et on lit : elle est super jolie.<br>Ta copine arrive derrière toi. Elle lit aussi. Tu essaies de penser à autre chose.<br>Tu fais le vide dans ta tête. Alors s&#x27;affiche : j&#x27;ai faim. J&#x27;ai faim. J&#x27;ai faim.<br>Au bout d&#x27;une semaine, tu apprends à penser uniquement des choses gentilles.<br>Tout le monde t&#x27;adore. Tu es promu. Tu te maries. Tout est parfait.<br>Mais le jour de ton mariage, devant tout le monde, s&#x27;affiche une dernière pensée.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tu voyais le passé de chaque objet que tu touches ?<\/h3><p class='script'>Et si tu voyais le passé de chaque objet que tu touches ? Juste avec la main.<br>Tu touches un banc. Tu vois deux amoureux qui se disent oui, il y a cinquante ans.<br>Tu touches la voiture d&#x27;occasion. Tu vois un accident. Tu ne l&#x27;achètes pas.<br>Tu touches la montre de ton grand-père. Tu le vois, jeune, qui rit sur une plage.<br>Tu deviens détective. Tu retrouves des clés, des bijoux, des disparus.<br>Puis un jour, tu emménages dans un nouvel appartement. Tu poses la main sur un mur.<br>Et tu vois la même scène, encore et encore : un homme qui regarde à travers ta fenêtre.<br>Tu te retournes. La fenêtre est ouverte. Et la poignée est encore chaude.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tu gagnais un euro à chaque sourire ?<\/h3><p class='script'>Et si tu gagnais un euro à chaque fois que tu souris ? Un vrai sourire.<br>Le premier jour, tu souris à ton café. Plus un euro. À ton chien. Plus un euro.<br>Tu souris aux inconnus. Dans le bus, la rue, au supermarché. Tu gagnes quarante euros.<br>Mais tu vois bien que les faux sourires ne comptent pas. Il faut être heureux pour de vrai.<br>Alors tu changes ta vie. Tu rends service. Tu appelles tes amis. Tu fais rire des gens.<br>En un mois, tu gagnes mille euros. Mais surtout, tu te sens vraiment bien.<br>Alors un jour, tu oublies de regarder ton compteur. Tu souris juste comme ça.<br>Et là, une notification : plus un million d&#x27;euros. Un vrai sourire n&#x27;a pas de prix.<br>Abonne-toi si tu veux la suite.<\/p><h3>Et si ton ombre arrivait en retard ?<\/h3><p class='script'>Et si ton ombre arrivait toujours une seconde en retard ?<br>Tu lèves la main. Ton ombre la lève après toi. Tu cligne des yeux. Elle aussi, juste après.<br>Au début, tu rigoles. Personne d&#x27;autre ne remarque rien. Tu dis que c&#x27;est un jeu de lumière.<br>Mais chaque jour, le retard grandit. Deux secondes. Cinq secondes. Dix secondes.<br>Un soir, tu t&#x27;arrêtes net au milieu d&#x27;un couloir. Ton ombre, elle, continue de marcher.<br>Elle ouvre une porte que tu n&#x27;as jamais vue. Tu n&#x27;oses pas la suivre.<br>Elle revient une heure plus tard. Elle te fait un petit signe de la main. Et elle sourit.<br>Parce que toi, tu ne souriais pas.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tu pouvais te téléporter, mais seulement là où tu es déjà allé ?<\/h3><p class='script'>Et si tu pouvais te téléporter, mais seulement là où tu es déjà allé ?<br>Tu pars à la plage en une seconde. Le soleil, la mer, et personne autour de toi.<br>Tu déjeunes en Italie, tu goûtes une pizza, et tu rentres avant que ton café ne refroidisse.<br>Tu manques ton bus ? Tu te téléportes au travail. Tu es toujours à l&#x27;heure. Plus jamais en retard.<br>Mais un soir, tu penses à ta maison d&#x27;enfance, celle que tu avais quittée à sept ans.<br>Tu te téléportes. Tu apparais dans le salon. Tout est exactement comme avant.<br>La table est mise pour quatre. Il y a encore du café chaud sur la table.<br>Et une voix dit, depuis la cuisine : tu es en retard, ton repas va refroidir.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tu pouvais recommencer ta vie à dix ans ?<\/h3><p class='script'>Et si un inconnu te proposait de recommencer ta vie à dix ans ? Avec tout ce que tu sais.<br>Tu acceptes tout de suite. Tu redeviens un enfant. Dans ta chambre, avec tes jouets.<br>Tu travailles dur à l&#x27;école. Tu apprends les langues. Tu investis tes économies dans les bonnes idées.<br>À vingt ans, tu es riche. À trente ans, tu es célèbre. Tout le monde t&#x27;envie.<br>Mais ton meilleur ami d&#x27;enfance ne te parle plus. Tu l&#x27;as oublié en chemin.<br>Tu retrouves l&#x27;inconnu et tu lui dis : je veux revenir en arrière. Je préférais avant.<br>Il sourit et il te dit : je sais. C&#x27;est pour ça que j&#x27;ai proposé.<br>Parce que tout le monde accepte. Et personne, jamais, ne choisit de le refaire une deuxième fois.<br>Abonne-toi pour la partie deux.<\/p><h3>Et si tu voyais la batterie sociale des gens ?<\/h3><p class='script'>Et si tu voyais une batterie au-dessus de chaque personne ? Sa batterie sociale.<br>Ton collègue qui parle trop : cent pour cent. Ton ami timide : deux pour cent.<br>Tu comprends enfin pourquoi il ne répond jamais. Tu arrêtes de lui en vouloir.<br>Au lieu de l&#x27;inviter à une grosse soirée, tu lui proposes une marche tranquille.<br>Sa batterie remonte. Doucement. Cinquante pour cent. Il te sourit pour la première fois.<br>Tu fais ça avec tout le monde. Tu apprends à écouter. Tu recharges les gens autour de toi.<br>Mais un soir, ton meilleur ami te dit : ça va ? Tu sembles fatigué.<br>Tu regardes ta batterie dans la vitre. Un pour cent. Tu n&#x27;avais pas vu.<br>Abonne-toi, ça fait toujours du bien.<\/p><h3>Et si tout le monde te disait la vérité pendant 24 heures ?<\/h3><p class='script'>Et si pendant vingt-quatre heures, absolument tout le monde te disait la vérité ?<br>Le matin, ton boulanger te dit : ta coupe de cheveux est ratée. Mais le pain est gratuit.<br>Ton patron avoue : ton projet est excellent. Je préfère garder la promotion pour moi.<br>Ta mère t&#x27;explique, sans rire : ton cadeau de Noël, je l&#x27;ai déjà revendu.<br>Tu rentres, épuisé. Mais tu apprends enfin des choses utiles sur tes amis.<br>Le soir, tu retrouves ton meilleur ami. Tu lui demandes : tu es vraiment mon ami ?<br>Il réfléchit longuement. Puis il te dit : oui. Depuis toujours. Et je n&#x27;ai jamais menti.<br>Tu pleures de joie. Et il ajoute : sauf une fois. Mais ça, je te le dirai demain.<br>Abonne-toi pour la partie deux.<\/p>", "ex": null}]}];
const flat = [];
DATA.forEach((m, i) => m.lessons.forEach((l, j) => flat.push({m: i, l: j})));
let done = {};
try { done = JSON.parse(localStorage.getItem("sc-done") || "{}"); } catch (e) {}
let cur = 0;
try { cur = Math.min(flat.length - 1, Math.max(0, +(localStorage.getItem("sc-cur") || 0))); } catch (e) {}
const key = k => flat[k].m + "." + flat[k].l;
function save() { try { localStorage.setItem("sc-done", JSON.stringify(done)); localStorage.setItem("sc-cur", cur); } catch (e) {} }
function navBuild() {
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  DATA.forEach((m, i) => {
    const d = document.createElement("details");
    d.open = flat[cur].m === i;
    const s = document.createElement("summary");
    const n = m.lessons.length, nd = m.lessons.filter((_, j) => done[i + "." + j]).length;
    s.innerHTML = '<span class="n">' + (i === DATA.length - 1 ? "★" : i) + '</span><span>' + m.title + ' <small style="color:var(--muted);font-weight:400">' + nd + "/" + n + "</small></span>";
    d.appendChild(s);
    const ol = document.createElement("ol");
    m.lessons.forEach((l, j) => {
      const k = flat.findIndex(x => x.m === i && x.l === j);
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; if (k === cur) b.className = "cur";
      b.innerHTML = '<span class="ck">' + (done[i + "." + j] ? "✓" : "") + "</span><span>" + l.title + "</span>";
      b.onclick = () => go(k);
      li.appendChild(b); ol.appendChild(li);
    });
    d.appendChild(ol); nav.appendChild(d);
  });
}
function render() {
  const f = flat[cur], m = DATA[f.m], l = m.lessons[f.l];
  document.getElementById("crumb").textContent = (f.m === DATA.length - 1 ? "Bonus" : "Module " + f.m + " · " + m.title) + " · Leçon " + (f.l + 1) + "/" + m.lessons.length;
  document.getElementById("ltitle").textContent = l.title;
  document.getElementById("lintro").textContent = f.l === 0 ? m.intro : "";
  let body = l.body.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>");
  if (l.ex) body += '<div class="ex"><b>Exercice.</b> ' + l.ex + "</div>";
  document.getElementById("lbody").innerHTML = body;
  document.getElementById("prev").disabled = cur === 0;
  document.getElementById("next").disabled = cur === flat.length - 1;
  document.getElementById("donebox").checked = !!done[key(cur)];
  const nd = Object.values(done).filter(Boolean).length;
  document.getElementById("pbar").style.width = (100 * nd / flat.length) + "%";
  document.getElementById("plbl").textContent = nd + " / " + flat.length + " leçons terminées";
  navBuild();
}
function go(k) { cur = k; save(); render(); window.scrollTo({top: 0}); }
document.getElementById("prev").onclick = () => cur > 0 && go(cur - 1);
document.getElementById("next").onclick = () => { done[key(cur)] = true; if (cur < flat.length - 1) go(cur + 1); else { save(); render(); } };
document.getElementById("donebox").onchange = e => { done[key(cur)] = e.target.checked; save(); render(); };
render();
</script>
</body></html>
